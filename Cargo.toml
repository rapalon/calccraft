# The app is the workspace's root package. `crates/core` holds the engines without a user
# interface, and `crates/mcp` the MCP server for AI agents (docs/mcp-server-plan.md).
# Commands run in the root build and test the app only; add `--workspace` for all three.
[workspace]
members = ["crates/core", "crates/mcp"]

# One version for the app, the core and the MCP server: a release bumps it here.
[workspace.package]
version = "1.3.2"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[package]
name = "calculator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A clone of the Windows 11 Calculator (Standard, Scientific, Graphing, Programmer, Date calculation and unit converters) built with egui"
readme = "README.md"
publish = false

# The app is a library that `main.rs` starts on desktops and in the browser, and that Android
# loads as `libcalculator.so` (see android/README.md).
[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
calccraft-core = { path = "crates/core" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
num-bigint = "0.4"
num-rational = "0.4.2"
num-traits = "0.2.19"
# `std::time::SystemTime::now()` panics in the browser; web-time's works everywhere.
web-time = "1.1"

# eframe is listed per target: a dependency in both [dependencies] and a target table gets
# the union of their features, and the web and Android builds want glow instead of the
# default wgpu.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
arboard = { version = "3.6", default-features = false }
eframe = { version = "0.36.2", features = ["persistence"] }

# The Android app (see android/README.md): a NativeActivity drawn with OpenGL ES through glow,
# as in egui's hello_android, and JNI for what only Java can tell (insets, languages).
# eframe's screen reader support (`accesskit`) needs GameActivity on Android, so TalkBack
# can't read the app yet.
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
eframe = { version = "0.36.2", default-features = false, features = [
    "android-native-activity",
    "default_fonts",
    "glow",
    "persistence",
] }
jni = "0.21"
log = "0.4"
# eframe's `NativeOptions::android_app` is winit's `AndroidApp`; the version eframe uses.
winit = { version = "0.30", default-features = false }

# The web version (see docs/web-version-plan.md): WebGL through glow, which every current
# browser has, and the browser's own APIs for the language, formats, clipboard and downloads.
[target.'cfg(target_arch = "wasm32")'.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "wasmbind"] }
eframe = { version = "0.36.2", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "web_screen_reader",
] }
js-sys = "0.3.106"
log = "0.4"
png = "0.18"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = [
    "Blob",
    "BlobPropertyBag",
    "Clipboard",
    "Document",
    "Element",
    "EventTarget",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "KeyboardEvent",
    "Location",
    "Navigator",
    "Url",
    "Window",
] }

[target."cfg(windows)".dependencies]
png = "0.18"
raw-window-handle = "0.6"
windows = { version = "0.62", features = [
    "ApplicationModel_DataTransfer",
    "Foundation_Collections",
    "Storage_Streams",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[dev-dependencies]
# For `icon::tests::write_web_icons`, on every system.
png = "0.18"

[build-dependencies]
winresource = "0.1.34"
