[package]
name = "calculator"
version = "1.4.6"
edition = "2024"
rust-version = "1.95"
description = "A clone of the Windows 11 Calculator (Standard, Scientific, Graphing, Programmer, Date calculation and unit converters) built with egui"
readme = "README.md"
publish = false

[features]
default = ["support-prompt"]
support-prompt = []
# The Google Play builds' distribution channels (docs/support-prompt.md, section 8): no donate
# link. `play-free` leads to the paid app's listing (CALCCRAFT_PAID_ID at build time, else no
# prompt); `play-paid` shows no prompt. At most one of them.
play-free = ["support-prompt"]
play-paid = ["support-prompt"]

# The app is a library that `main.rs` starts on desktops and in the browser, and that Android
# loads as `libcalculator.so` (see android/README.md).
[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
num-bigint = "0.4"
num-rational = "0.4.2"
num-traits = "0.2.19"
# `std::time::SystemTime::now()` panics in the browser; web-time's works everywhere.
web-time = "1.1"

# eframe is listed per target: a dependency in both [dependencies] and a target table gets
# the union of their features, and the web and Android builds want glow instead of the
# default wgpu.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
arboard = { version = "3.6", default-features = false }
eframe = { version = "0.36.2", features = ["persistence"] }

# The Android app (see android/README.md): a NativeActivity drawn with OpenGL ES through glow,
# as in egui's hello_android, and JNI for what only Java can tell (insets, languages).
# eframe's screen reader support (`accesskit`) reaches TalkBack and the other accessibility
# services through accesskit_winit's Android adapter, which upstream wrote for GameActivity:
# the copy in vendor/accesskit_winit (see [patch.crates-io] below) hooks NativeActivity's
# content view instead, from Android 8.0 (android/README.md, "Accessibility").
[target.'cfg(target_os = "android")'.dependencies]
# The Android adapter is behind accesskit_winit's own `accesskit_android` feature, which
# egui-winit doesn't pass on: without this line eframe's `accesskit` is a no-op on Android.
accesskit_winit = { version = "0.32.2", features = ["accesskit_android"] }
android_logger = "0.15"
# Not eframe's `android-native-activity`: eframe refuses `accesskit` with it (its adapter
# knows only GameActivity, which this build doesn't use). The feature only passes through
# egui-winit to winit, so winit gets it below, straight from here.
eframe = { version = "0.36.2", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "persistence",
] }
jni = "0.21"
# `calccraft_on_create` (src/lib.rs) wraps NativeActivity's onDestroy callback and ends the
# process with `_exit` (android/README.md, "One activity, one process"); the versions
# android-activity uses.
libc = "0.2"
log = "0.4"
ndk-sys = "0.6"
# The graph's Share writes a PNG for the share sheet (src/app/share.rs).
png = "0.18"
# eframe's `NativeOptions::android_app` is winit's `AndroidApp`; the version eframe uses.
# `android-native-activity` picks NativeActivity (android/AndroidManifest.xml) for winit and
# android-activity, in eframe's place (see above).
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }

# The web version (see docs/web-version-plan.md): WebGL through glow, which every current
# browser has, and the browser's own APIs for the language, formats, clipboard and downloads.
[target.'cfg(target_arch = "wasm32")'.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "wasmbind"] }
eframe = { version = "0.36.2", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "web_screen_reader",
] }
js-sys = "0.3.106"
log = "0.4"
png = "0.18"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = [
    "Blob",
    "BlobPropertyBag",
    "Clipboard",
    "Document",
    "Element",
    "EventTarget",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "KeyboardEvent",
    "Location",
    "Navigator",
    "Url",
    "Window",
] }

[target."cfg(windows)".dependencies]
png = "0.18"
raw-window-handle = "0.6"
windows = { version = "0.62", features = [
    "ApplicationModel_DataTransfer",
    "Foundation_Collections",
    "Storage_Streams",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[dev-dependencies]
# For tests/vendor.rs, which tests the Android adapter's root bounds (vendor/accesskit_winit)
# on every system; the version egui uses.
accesskit = "0.24"
# For the accessibility tree tests (src/app/a11y_tests.rs, tests/vendor.rs): the tree as the
# platform adapters see it, with AccessKit's own filter; the version accesskit_android uses.
accesskit_consumer = "0.38"
# tests/vendor.rs includes the Android adapter's focus guard, which logs.
log = "0.4"
# For the icon tests (`icon::tests`), which read the generated PNGs, on every system.
png = "0.18"

[build-dependencies]
winresource = "0.1.34"

# accesskit_winit (eframe's screen reader bridge) with one change: its Android adapter hooks
# NativeActivity's content view, the release's only GameActivity's (vendor/accesskit_winit,
# android/README.md "Accessibility"). The copy must stay at the version egui-winit asks for,
# or Cargo only warns that the patch is unused and Android loses its accessibility tree:
# tests/vendor.rs fails then, and the copy has to be re-applied to the new release.
[patch.crates-io]
accesskit_winit = { path = "vendor/accesskit_winit" }
