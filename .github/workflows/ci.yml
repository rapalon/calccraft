name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    # The app targets Windows (DWM title bar tint, Segoe fonts, the share sheet), and the
    # releases are built for Linux and macOS too, so CI checks all three.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Stable must be at least 1.95, the crate's rust-version.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # eframe's build dependencies on Linux (see egui's README).
      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      # The Google Play channels (docs/support-prompt.md, section 8) build the support prompt
      # differently: their own tests, with and without the paid app's ID.
      - name: Test the Google Play channels
        if: runner.os == 'Linux'
        run: |
          cargo test --lib --features play-free support
          CALCCRAFT_PAID_ID=com.rapalon.calccraft.pro cargo test --lib --features play-free support
          cargo test --lib --features play-paid support

  licenses:
    name: licenses (cargo-deny)
    # Every library in Cargo.lock must have a license from deny.toml's allow-list: permissive
    # open-source licenses such as MIT, Apache-2.0 and BSD. A new dependency under a copyleft
    # license (GPL, LGPL, MPL …) fails here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  web:
    name: web build (wasm32)
    # The web version (.github/workflows/pages.yml deploys it) builds from the same code, so
    # every push and pull request checks that it still compiles for the browser. Nothing is
    # deployed here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32

      - name: Clippy (wasm32)
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

      # A prebuilt Trunk; it fetches the wasm-bindgen and wasm-opt it needs itself.
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Build the web version
        run: trunk build --release

  android:
    name: Android build (arm64)
    # The Android app (android/README.md) builds from the same code, so every push and pull
    # request checks it and builds an APK and an App Bundle, signed with a debug key, which the
    # run keeps as an artifact for `adb install`.
    runs-on: ubuntu-latest
    env:
      NDK: 29.0.14206865
      BUILD_TOOLS: 36.0.0
      APPLICATION_ID: ${{ vars.ANDROID_APPLICATION_ID || 'com.rapalon.calccraft' }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # The runner has the Android SDK and a JDK; these are the packages build-apk.ps1 uses.
      - name: Install the Android SDK packages
        run: >
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install
          "platforms;android-36" "build-tools;$BUILD_TOOLS" "ndk;$NDK" > /dev/null

      - name: Clippy (Android)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK"
          cargo ndk -t arm64-v8a -P 24 clippy --all-targets -- -D warnings
          cargo ndk -t arm64-v8a -P 24 clippy --all-targets --features play-free -- -D warnings
          CALCCRAFT_PAID_ID=com.rapalon.calccraft.pro cargo ndk -t arm64-v8a -P 24 clippy --all-targets --features play-free -- -D warnings
          cargo ndk -t arm64-v8a -P 24 clippy --all-targets --features play-paid -- -D warnings

      - name: Build the APK and the App Bundle
        shell: pwsh
        run: android/build-apk.ps1 -Ndk $env:NDK -BuildTools $env:BUILD_TOOLS -Bundle

      # The bundle's manifest must carry the values of android/README.md, and the universal APK
      # bundletool builds from it (what Google Play would make of it) the library on 16 KB pages.
      - name: Check the App Bundle
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          IFS=. read -r major minor patch <<< "$version"
          code=$((major * 10000 + minor * 100 + patch))
          jar=$(ls .tools/bundletool-all-*.jar)
          aab="target/android/CalcCraft-$version-arm64.aab"
          java -jar "$jar" dump manifest --bundle="$aab"
          for check in "@package=$APPLICATION_ID" "@android:versionCode=$code" "@android:versionName=$version" \
              "uses-sdk/@android:minSdkVersion=24" "uses-sdk/@android:targetSdkVersion=36" \
              "application/@android:hasCode=true" \
              "application/provider/@android:name=com.rapalon.calccraft.ShareProvider" \
              "application/provider/@android:authorities=$APPLICATION_ID.share" \
              "application/provider/@android:exported=false" \
              "application/provider/@android:grantUriPermissions=true"; do
            value=$(java -jar "$jar" dump manifest --bundle="$aab" --xpath "/manifest/${check%%=*}")
            if [ "$value" != "${check#*=}" ]; then
              echo "::error::The bundle's manifest has ${check%%=*} = '$value', not '${check#*=}'."
              exit 1
            fi
          done
          java -jar "$jar" build-apks --mode=universal --bundle="$aab" --output=target/android/universal.apks
          unzip -o -q target/android/universal.apks universal.apk -d target/android
          tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          "$tools/aapt2" dump badging target/android/universal.apk | tee target/android/badging.txt
          grep -q "^native-code: 'arm64-v8a'" target/android/badging.txt
          "$tools/zipalign" -c -P 16 4 target/android/universal.apk
          # The share provider's code (android/java) is in both the APK and the bundle's APKs.
          "$tools/dexdump" target/android/universal.apk | grep -q "Lcom/rapalon/calccraft/ShareProvider;"
          "$tools/dexdump" "target/android/CalcCraft-$version-arm64.apk" | grep -q "Lcom/rapalon/calccraft/ShareProvider;"

      - uses: actions/upload-artifact@v4
        with:
          name: CalcCraft-android-arm64
          path: |
            target/android/*.apk
            target/android/*.aab
          if-no-files-found: error

      # The Google Play App Bundles (docs/support-prompt.md, section 8), after the upload above:
      # build-apk.ps1 starts each build with an empty target/android. It fails when a Play
      # library contains the donate page's or Stripe's address. The paid bundle must carry the
      # paid app's ID.
      - name: Build and check the Google Play free and paid App Bundles
        shell: pwsh
        run: |
          # A hashtable: an array splat would pass '-Ndk' to a script as a positional value.
          $common = @{ Ndk = $env:NDK; BuildTools = $env:BUILD_TOOLS; Bundle = $true }
          android/build-apk.ps1 @common -Channel play-free
          android/build-apk.ps1 @common -Channel play-free -PaidApplicationId com.rapalon.calccraft.pro
          android/build-apk.ps1 @common -Channel play-paid -PaidApplicationId com.rapalon.calccraft.pro
          $jar = (Get-ChildItem .tools/bundletool-all-*.jar).FullName
          $aab = (Get-ChildItem target/android/CalcCraft-Pro-*-arm64.aab).FullName
          $package = java -jar $jar dump manifest "--bundle=$aab" --xpath /manifest/@package
          if ($package -ne 'com.rapalon.calccraft.pro') {
              throw "The paid bundle's package is '$package', not com.rapalon.calccraft.pro."
          }
          # Its share provider follows the ID, so the free and paid apps can be installed together.
          $authority = java -jar $jar dump manifest "--bundle=$aab" --xpath /manifest/application/provider/@android:authorities
          if ($authority -ne 'com.rapalon.calccraft.pro.share') {
              throw "The paid bundle's share authority is '$authority', not com.rapalon.calccraft.pro.share."
          }
