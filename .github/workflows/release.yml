name: Release

# Pushing a tag such as v1.0.0 builds the app for Windows and Linux (x64), macOS (Universal 2
# for Apple silicon and Intel) and Android (arm64) and publishes them as a GitHub release. When it succeeds,
# pages.yml deploys the web version of the same commit.
#
# The Android APK and App Bundle (for Google Play) are signed with the upload key from the
# repository's secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS
# and, if the key has its own, ANDROID_KEY_PASSWORD; see android/README.md). Without them the
# APK gets a new debug key, and installing it over an earlier release needs an uninstall first;
# the bundle is skipped, since Play takes only one signed with the upload key.
#
# Run by hand (`gh workflow run release.yml --ref <branch>`), it builds only the Google Play
# test files of that branch, as an artifact of the run: the play-free App Bundle signed with
# the upload key, the universal APK bundletool makes from it (the same code Play installs), and
# a test APK with the application ID com.rapalon.calccraft.test, which installs next to the
# Play app. No tag, no release, nothing published.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build (default: the branch the run is for)
        required: false
        default: ""

permissions:
  contents: write # create the release and upload its files

env:
  CARGO_TERM_COLOR: always
  GH_REPO: ${{ github.repository }}

jobs:
  draft:
    name: Create the draft release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Catches a forgotten version bump before anything is built.
      - name: Check that the tag matches Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml."
            exit 1
          fi

      # A draft, so nothing is public until every platform has built and uploaded its file.
      # A re-run keeps the draft that is already there.
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            exit 0
          fi
          flags=(--draft --title "$GITHUB_REF_NAME" --generate-notes --verify-tag)
          # Tags with a suffix, such as v1.0.0-beta.1, become pre-releases.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}"

  build:
    name: Build (${{ matrix.name }})
    needs: draft
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # eframe's build dependencies on Linux (see egui's README).
      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev

      # CI runs on the same tag in parallel, but nothing stops it from publishing a failing
      # build.
      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          release="target/${{ matrix.target }}/release"
          asset="calculator-$GITHUB_REF_NAME-${{ matrix.name }}"
          mkdir dist
          case "${{ matrix.name }}" in
            windows-*)
              asset="$asset.exe"
              cp "$release/calculator.exe" "dist/$asset"
              ;;
            linux-*)
              # A tarball keeps the executable bit.
              asset="$asset.tar.gz"
              tar -czf "dist/$asset" -C "$release" calculator
              ;;
          esac
          cd dist
          # sha256sum's format, which `sha256sum -c` and `shasum -a 256 -c` check.
          if command -v sha256sum > /dev/null; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi

      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  macos:
    name: Build (macos-universal)
    needs: draft
    if: github.event_name == 'push'
    # Apple silicon, free for public repositories, and the image CI tests on. GitHub retired
    # macos-14 on 2026-11-02, which stopped the v1.4.0 run before "Publish the release".
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal

      # Run tests on the runner's native architecture (Apple silicon).
      - name: Test
        run: cargo test --locked

      # Build both Apple silicon (native) and Intel (cross-compiled).
      - name: Build
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          app="dist/CalcCraft.app"
          mkdir -p "$app/Contents/MacOS"

          # Combine both architectures into a single Universal 2 executable.
          lipo -create -output "$app/Contents/MacOS/calculator" \
            target/aarch64-apple-darwin/release/calculator \
            target/x86_64-apple-darwin/release/calculator

          # Verify that both architectures are present, fail otherwise.
          echo "Verifying universal binary architectures with lipo -info:"
          lipo_info=$(lipo -info "$app/Contents/MacOS/calculator")
          echo "$lipo_info"
          if ! echo "$lipo_info" | grep -q "arm64"; then
            echo "::error::Missing arm64 slice in universal binary"
            exit 1
          fi
          if ! echo "$lipo_info" | grep -q "x86_64"; then
            echo "::error::Missing x86_64 slice in universal binary"
            exit 1
          fi

          # An app bundle, so Finder and the Dock treat it as an app.
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>CalcCraft</string>
            <key>CFBundleDisplayName</key><string>CalcCraft</string>
            <key>CFBundleIdentifier</key><string>com.rapalon.calccraft</string>
            <key>CFBundleExecutable</key><string>calculator</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSHumanReadableCopyright</key><string>CalcCraft by Rapalon Labs</string>
          </dict>
          </plist>
          EOF

          # Code signing and notarization placeholder:
          # Currently signed ad hoc (-). When an Apple Developer account is configured,
          # replace ad-hoc signing with Apple Developer ID signing and notarization:
          # 1. Import Developer ID Application certificate (.p12) from secrets:
          #    APPLE_CERTIFICATE_BASE64, APPLE_CERTIFICATE_PASSWORD
          # 2. Sign with hardened runtime and timestamp:
          #    codesign --force --deep --options runtime --timestamp --sign "Developer ID Application: <Name> (<TeamID>)" "$app"
          # 3. Zip or DMG package and submit to Apple notary service:
          #    xcrun notarytool submit "$asset" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          # 4. Staple the notarization ticket:
          #    xcrun stapler staple "$app"
          codesign --force --deep --sign - "$app"

          asset="calculator-$GITHUB_REF_NAME-macos-universal.zip"
          ditto -c -k --keepParent "$app" "dist/$asset"
          rm -rf "$app"

          cd dist
          # sha256sum's format, which `sha256sum -c` and `shasum -a 256 -c` check.
          if command -v sha256sum > /dev/null; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi

      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  android:
    name: Build (android-arm64)
    needs: draft
    # Run by hand, there is no draft: this job alone runs.
    if: ${{ !cancelled() && (needs.draft.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    env:
      NDK: 29.0.14206865
      # Google Play takes only bundles signed with the upload key.
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # The runner has the Android SDK and a JDK; these are the packages build-apk.ps1 uses.
      - name: Install the Android SDK packages
        run: >
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install
          "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK" > /dev/null

      - name: Build the APK and the App Bundle
        if: github.event_name == 'push'
        shell: pwsh
        env:
          APPLICATION_ID: ${{ vars.ANDROID_APPLICATION_ID || 'com.rapalon.calccraft' }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # A hashtable: an array splat passes '-Bundle' to a script as a positional value,
          # which binds to -Channel and fails its ValidateSet (the v1.4.0 run did).
          $bundle = @{}
          if ($env:ANDROID_KEYSTORE_BASE64) {
              $env:ANDROID_KEYSTORE = Join-Path $env:RUNNER_TEMP 'release.keystore'
              [IO.File]::WriteAllBytes($env:ANDROID_KEYSTORE,
                  [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
              $bundle = @{ Bundle = $true }
          } else {
              '::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a debug key, and no App Bundle is built (Google Play takes only one signed with the upload key).'
          }
          android/build-apk.ps1 -Ndk $env:NDK -ApplicationId $env:APPLICATION_ID @bundle

      - name: Package
        if: github.event_name == 'push'
        run: |
          asset="calculator-$GITHUB_REF_NAME-android-arm64"
          mkdir dist
          cp target/android/CalcCraft-*-arm64.apk "dist/$asset.apk"
          # The bundle is there only when the upload key was.
          if ls target/android/CalcCraft-*-arm64.aab > /dev/null 2>&1; then
            cp target/android/CalcCraft-*-arm64.aab "dist/$asset.aab"
          fi
          cd dist
          for file in "$asset".*; do
            sha256sum "$file" > "$file.sha256"
          done

      - name: Upload to the draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber

      # The Google Play App Bundles (docs/support-prompt.md, section 8), signed with the upload
      # key: the free app (play-free; its popup leads to the paid app once the repository
      # variable CALCCRAFT_PAID_ID names it, and is hidden until then) and, with that variable,
      # the paid app (play-paid). They go to the run's artifacts for the Play Console, not to
      # the GitHub release, whose APK and bundle above keep the default channel.
      - name: Build the Google Play App Bundles
        if: github.event_name == 'push' && env.HAS_UPLOAD_KEY == 'true'
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APPLICATION_ID: ${{ vars.ANDROID_APPLICATION_ID || 'com.rapalon.calccraft' }}
          PAID_ID: ${{ vars.CALCCRAFT_PAID_ID }}
        run: |
          $env:ANDROID_KEYSTORE = Join-Path $env:RUNNER_TEMP 'release.keystore'
          [IO.File]::WriteAllBytes($env:ANDROID_KEYSTORE,
              [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
          New-Item -ItemType Directory -Force play | Out-Null
          android/build-apk.ps1 -Ndk $env:NDK -ApplicationId $env:APPLICATION_ID -Channel play-free -PaidApplicationId "$env:PAID_ID" -Bundle
          Copy-Item target/android/CalcCraft-Play-*-arm64.aab play/
          if ($env:PAID_ID) {
              android/build-apk.ps1 -Ndk $env:NDK -Channel play-paid -PaidApplicationId $env:PAID_ID -Bundle
              Copy-Item target/android/CalcCraft-Pro-*-arm64.aab play/
          } else {
              '::notice::No CALCCRAFT_PAID_ID variable: no paid app bundle, and the free app hides its support prompt.'
          }

      - name: Keep the Google Play App Bundles
        if: github.event_name == 'push' && env.HAS_UPLOAD_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CalcCraft-google-play-${{ github.ref_name }}
          path: play/*.aab
          if-no-files-found: error

      # Run by hand: the files to try before a Play upload. Only with the upload key, since
      # the point is the exact code Play would get.
      - name: Build the Google Play test files
        id: test-files
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APPLICATION_ID: ${{ vars.ANDROID_APPLICATION_ID || 'com.rapalon.calccraft' }}
          PAID_ID: ${{ vars.CALCCRAFT_PAID_ID }}
        run: |
          if (-not $env:ANDROID_KEYSTORE_BASE64) {
              '::error::No ANDROID_KEYSTORE_BASE64 secret: the Google Play test files need the upload key.'
              exit 1
          }
          $env:ANDROID_KEYSTORE = Join-Path $env:RUNNER_TEMP 'release.keystore'
          [IO.File]::WriteAllBytes($env:ANDROID_KEYSTORE,
              [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
          New-Item -ItemType Directory -Force play | Out-Null
          # The App Bundle for the Play Console and the universal APK made from it.
          android/build-apk.ps1 -Ndk $env:NDK -ApplicationId $env:APPLICATION_ID -Channel play-free -PaidApplicationId "$env:PAID_ID" -Bundle -UniversalApk
          Copy-Item target/android/CalcCraft-Play-*-arm64.aab, target/android/CalcCraft-Play-*-arm64-universal.apk play/
          # The side-by-side test app: its own application ID (and so its own share authority).
          android/build-apk.ps1 -Ndk $env:NDK -ApplicationId com.rapalon.calccraft.test -Channel play-free -PaidApplicationId "$env:PAID_ID"
          $apk = Get-Item target/android/CalcCraft-Play-*-arm64.apk
          Copy-Item $apk (Join-Path play ($apk.BaseName + '-test.apk'))
          Push-Location play
          $files = @(Get-ChildItem -File)
          $files | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } | Tee-Object SHA256SUMS
          Pop-Location
          $version = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json | ForEach-Object { $_.packages[0].version }
          "name=CalcCraft-google-play-test-$version-$(git rev-parse --short=7 HEAD)" >> $env:GITHUB_OUTPUT

      - name: Keep the Google Play test files
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.test-files.outputs.name }}
          path: play/*
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [build, macos, android]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
