# A copy of accesskit_winit 0.32.2 (https://github.com/AccessKit/accesskit, Apache-2.0: see
# LICENSE-APACHE) with one change, in src/platform_impl/android.rs: the Android adapter hooks
# NativeActivity's content view instead of GameActivity's surface view, and does nothing below
# Android 8.0 (android/README.md, "Accessibility"). `[patch.crates-io]` in the root Cargo.toml
# puts it in place of the crates.io release for every platform, so the version must stay the
# one egui-winit asks for; tests/vendor.rs checks that. The release's examples and
# dev-dependencies aren't carried over. The manifest is the release's Cargo.toml.orig with the
# workspace-inherited fields filled in.
[package]
name = "accesskit_winit"
version = "0.32.2"
authors = ["The AccessKit contributors"]
license = "Apache-2.0"
description = "AccessKit UI accessibility infrastructure: winit adapter"
categories = ["gui"]
keywords = ["gui", "ui", "accessibility", "winit"]
repository = "https://github.com/AccessKit/accesskit"
readme = "README.md"
edition = "2021"
rust-version = "1.85"
publish = false

[features]
default = ["accesskit_unix", "async-io", "rwh_06", "winit/x11", "winit/wayland"]
rwh_05 = ["winit/rwh_05", "dep:rwh_05"]
rwh_06 = ["winit/rwh_06", "dep:rwh_06"]
async-io = ["accesskit_unix/async-io"]
tokio = ["accesskit_unix/tokio"]

[dependencies]
accesskit = "0.24.0"
winit = { version = "0.30.5", default-features = false }
rwh_05 = { package = "raw-window-handle", version = "0.5", features = ["std"], optional = true }
rwh_06 = { package = "raw-window-handle", version = "0.6.2", features = ["std"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
accesskit_windows = "0.32.1"

[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos = "0.26.0"

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
accesskit_unix = { version = "0.21.0", optional = true, default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
accesskit_android = { version = "0.7.2", optional = true, features = ["embedded-dex"] }
# CalcCraft's change: the Android adapter says why it is skipped (adb logcat) instead of
# panicking.
log = "0.4"
